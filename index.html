    function setVhVariable() {

      document.documentElement.style.setProperty('--vh', `${vh}px`);

  <script>
    /* ================================
       SPA 엔진 — 플뤼겔 완성형 버전
       ================================ */

    const main = document.getElementById("main-content");

    /* 1) HTML fragment 로드 */
    async function loadPage(path, push = true) {
      try {
        // 경로 정규화 (중복 폴더 제거)
        path = normalizePath(path);

        const res = await fetch(path);
        if (!res.ok) throw new Error("Not found");

        const text = await res.text();

        // HTML 문자열을 DOM으로 파싱
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");

        // fragment 본문만 추출 (전체 문서가 와도 문제 없음)
        let content = doc.body ? doc.body.innerHTML : text;

        // 내부 링크 절대경로로 변환
        content = fixLinks(content);

        // DOM 주입
        main.innerHTML = content;

        // 스타일 안정화: reflow 1~2프레임
        await new Promise(r => requestAnimationFrame(r));
        await new Promise(r => requestAnimationFrame(r));

        // history API 갱신
        if (push) history.pushState({ path }, "", "/" + path);
      } catch (err) {
        // 실패 시 index로 복귀
        console.warn("Load fail, redirect root:", err);
        history.replaceState({}, "", "/");
        main.innerHTML = "<p>해당 문서를 찾을 수 없습니다.</p>";
      }
    }

    /* 2) 내부 링크 절대경로로 변환 */
    function fixLinks(html) {
      return html.replace(/href="(?!https?:|#|mailto:|tel)([^"]+)"/g, function(_, url){
        // 이미 절대경로면 그대로
        if (url.startsWith("/")) return `href="${url}"`;
        return `href="/${url}"`;
      });
    }

    /* 3) 중복 폴더 제거 (a/a/test.html 방지) */
    function normalizePath(path) {
      return path.replace(/^\//, "");
      const parts = path.split("/").filter(Boolean);
      const cleaned = [];
      for (const part of parts) {
        if (cleaned[cleaned.length - 1] === part) continue;
        cleaned.push(part);
      }
      return cleaned.join("/");
    }

    /* 4) 초기 로딩 처리 */
    window.addEventListener("DOMContentLoaded", () => {
      // 404.html에서 redirect된 경우
      const redirect = sessionStorage.redirect;
      if (redirect) {
        sessionStorage.removeItem("redirect");
        loadPage(redirect);
        return;
      }

      // 기본 메인 페이지
      loadPage("main.html");
    });

    /* 5) 뒤로가기/앞으로가기 지원 */
    window.addEventListener("popstate", (e) => {
      if (e.state?.path) loadPage(e.state.path, false);
    });

    /* 6) SPA 네비게이션 전역 처리 */
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (!a) return;

      const href = a.getAttribute("href");
      if (!href) return;

      // 외부 링크는 기본 동작
      if (/^(https?:|mailto:|tel)/.test(href)) return;

      // hash는 그대로
      if (href.startsWith("#")) return;

      e.preventDefault();

      // 내부 링크는 SPA로 처리
      const clean = href.replace(/^\//, "");
      loadPage(clean);
    });

  </script>
