  <!-- ⚙️ SPA 스크립트 (페이드 타이밍 개선판) -->
  <script>
  let currentRequest = null

  function fadeOut(el){el.style.opacity=1;return new Promise(r=>{const f=()=>{if((el.style.opacity-=0.08)<=0){el.style.display="none";r()}else requestAnimationFrame(f)};f()})}
  function fadeIn(el){el.style.opacity=0;el.style.display="";return new Promise(r=>{const f=()=>{let v=parseFloat(el.style.opacity);if(!((v+=0.08)>1)){el.style.opacity=v;requestAnimationFrame(f)}else r()};f()})}

  async function loadPage(page){
    const main=document.getElementById("main-content")
    if(!main)return
    await fadeOut(main)
    main.innerHTML='<div class="loading">Loading...</div>'

    if(currentRequest)currentRequest.abort?.()
    const controller=new AbortController()
    currentRequest=controller

    try{
      const fragmentURL=new URL("/"+page.replace(/^\/+/,'') ,location.origin)
      const url=new URL(fragmentURL)
      url.searchParams.set("_v",Date.now())

      const r=await fetch(url.toString(),{signal:controller.signal,cache:"reload"})
      if(!r.ok)throw new Error("HTTP "+r.status)

      let t=await r.text()
      const doc=new DOMParser().parseFromString(t,"text/html")
      let html=doc.body?doc.body.innerHTML:doc.documentElement.innerHTML

      const base=fragmentURL.toString().replace(/[^/]*$/,"")
      html=html.replace(/(src|href)="(?!https?:|mailto:|tel:|#)([^"]+)"/g,(_,a,p)=>{
        try{
          if(p.includes("style.css"))return`${a}="/style.css"`
          if(p.includes("favicon.ico"))return`${a}="/favicon.ico"`
          return`${a}="${new URL(p,base)}"`
        }catch{return`${a}="${p}"`}
      })

      main.style.display='none'
      main.innerHTML=html

      // 스타일 적용을 기다린 뒤 한 프레임 후 페이드 시작
      await new Promise(requestAnimationFrame)
      await fadeIn(main)

      main.querySelectorAll("a[href]").forEach(a=>{
        const href=a.getAttribute("href")||""
        if(/^(https?:|mailto:|tel:|#)/i.test(href))return
        const abs=new URL(href,base)
        if(abs.origin===location.origin){
          const pagePath=abs.pathname.replace(/^\/+/,'')
          a.setAttribute("data-page",pagePath)
          a.setAttribute("href","\#")
        }
      })

    }catch(e){
      if(e.name!=='AbortError'){
        console.error("불러오기 실패:",page,e)
        main.innerHTML=`<p style="color:red;">불러오기 실패: ${page}</p>`
        fadeIn(main)
      }
    }finally{currentRequest=null}
  }

  window.addEventListener("DOMContentLoaded",()=>{
    const r=sessionStorage.redirect
    if(r){sessionStorage.removeItem("redirect");loadPage(r.replace(/^\/+/,''));return}
    const p=location.pathname.replace(/^\/+/,"")
    if(p&&!p.endsWith("/")){loadPage(p);history.replaceState({page:p},"","/"+p)}else loadPage("main.html")
  })

  document.addEventListener("click",e=>{
    const a=e.target.closest("a[data-page]")
    if(!a)return
    e.preventDefault()
    const p=a.getAttribute("data-page")
    loadPage(p)
    history.pushState({page:p},"",location.origin+"/"+p)
  })

  window.addEventListener("popstate",e=>{
    if(e.state&&e.state.page)loadPage(e.state.page);else loadPage("main.html")
  })

  ;(function fixDoubleFolders(){
    const parts=location.pathname.split("/").filter(Boolean)
    for(let i=0;i<parts.length-1;i++){
      if(parts[i]===parts[i+1]){
        parts.splice(i,1)
        const f="/"+parts.join("/")+location.search+location.hash
        history.replaceState(null,"",f)
        break
      }
    }
  })()
  </script>
