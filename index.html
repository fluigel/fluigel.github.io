<button id="scroll-top-btn" class="scroll-top-btn">↑</button>

<script>
/* ============================================================
   🔼 위로가기 버튼 — 플뤼겔 SPA 전용 스크롤 완전체 안정판
   - 휠 스크롤 OK
   - 스크롤바 드래그 OK
   - 터치 스크롤 OK
   - SPA 구조 변화에도 안전
   - scrollRoot가 무엇이든 100% 감지
   ============================================================ */

const topBtn = document.getElementById("scroll-top-btn");
const SHOW_AT = 520;

// 현재 스크롤 위치를 브라우저 종류와 관계없이 가져오기
function getScrollY() {
  return (
    window.scrollY ||
    document.documentElement.scrollTop ||
    document.body.scrollTop ||
    0
  );
}

// 공통 스크롤 처리
function handleScroll() {
  const y = getScrollY();

  if (y > SHOW_AT) topBtn.classList.add("show");
  else topBtn.classList.remove("show");
}

// 🚨 스크롤 입력 가능한 모든 루트에 이벤트 연결 (강한 안정성)
["scroll", "wheel", "touchmove"].forEach(evt => {
  window.addEventListener(evt, handleScroll);
  document.addEventListener(evt, handleScroll);
  document.documentElement.addEventListener(evt, handleScroll);
  document.body.addEventListener(evt, handleScroll);
});

// (SPA 대비) 콘텐츠 교체 뒤 main-content가 스크롤을 가질 수도 있으므로 감시
document.addEventListener("DOMContentLoaded", () => {
  const main = document.getElementById("main-content");
  if (main) main.addEventListener("scroll", handleScroll);
});

// 위로가기 클릭 — 무조건 최상단으로 보내는 3중 백업방식
topBtn.addEventListener("click", () => {
  // 1) 가장 강력함 — SPA에서도 잘 먹힘
  document.body.scrollTop = 0;

  // 2) html 기반 스크롤 브라우저
  document.documentElement.scrollTop = 0;

  // 3) 최신 브라우저 부드러운 효과
  window.scrollTo({ top: 0, behavior: "smooth" });

  // 4) 즉시 숨기기 (scroll 이벤트가 안 들어오는 경우 대비)
  topBtn.classList.remove("show");
});
</script>

<script>
/* ============================================================
   📱 모바일 토글 스크립트
   ============================================================ */

const toggleBtn = document.getElementById('menu-toggle');
const menuPanel = document.getElementById('menu-panel');

toggleBtn.addEventListener('click', () => {
  const open = menuPanel.classList.toggle('open');
  document.body.classList.toggle('menu-open', open);
});

// 메뉴 바깥 클릭 시 자동 닫힘
document.addEventListener('click', (e) => {
  if (menuPanel.classList.contains('open') &&
      !e.target.closest('#menu-panel') &&
      !e.target.closest('#menu-toggle')) {
    menuPanel.classList.remove('open');
    document.body.classList.remove('menu-open');
  }
});
</script>

<script>
/* ============================================================
   📌 플뤼겔의 탑 — 전체 카테고리 자동 카운트 엔진 (최종판)
   - HOME 제외 모든 메뉴 자동 카운트
   - _list.html → 리스트 개수 자동 표시
   - 단일 HTML → 자동 (1) 표시
   - 대표 카테고리(div.menu-group) → 하위 합산
   - 다양한 리스트 클래스 지원
   ============================================================ */

/* ----------------------------
   1) 글 개수 계산 함수
   ---------------------------- */
async function getCountFromPath(path) {
  try {
    if (path.endsWith(".html") && !path.includes("_list")) {
      console.log("✔ 단일 HTML 인식:", path, "→ 1");
      return 1;
    }

    const full = path.endsWith(".html") ? path : path + "_list.html";
    const res = await fetch(window.location.origin + "/" + full);
    if (!res.ok) {
      console.warn("⚠ fetch 실패:", full, res.status);
      return 0;
    }

    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");

    // 모든 리스트 클래스 지원
    let count = doc.querySelectorAll(
      `.page-list-body a,
       .page-list-middle-body a,
       .page-list-small-body a`
    ).length;

    console.log("📄 리스트 인식:", full, "→", count);
    return count;
  } catch (err) {
    console.error("🚫 카운트 오류:", path, err);
    return 0;
  }
}

/* ----------------------------
   2) 전체 메뉴 자동 스캔 & 업데이트
   ---------------------------- */
async function autoCountMenu() {
  const nav = document.querySelector("nav");
  if (!nav) return;

  const allLinks = nav.querySelectorAll("a[href]");
  const menuGroups = nav.querySelectorAll(".menu-group");
  const results = new Map();

  for (const link of allLinks) {
    const href = link.getAttribute("href");
    if (!href || href === "/main.html") continue;
    
    // 🔥 파일 다운로드 링크는 카운트 제외
    if (/\.(zip|txt|pdf|png|jpg|jpeg|gif|svg)$/i.test(href)) continue;

    const cleanPath = href.startsWith("/") ? href.substring(1) : href;
    const count = await getCountFromPath(cleanPath);
    results.set(href, count);

    link.textContent = link.textContent.replace(/\s*\(\d+\)$/, "");
    link.textContent += ` (${count})`;
  }

  for (const group of menuGroups) {
    const parent = group.querySelector(".parent[href]");
    const children = group.querySelectorAll("ul a[href]");

    if (!parent || children.length === 0) continue;

    let total = 0;
    for (const child of children) {
      const href = child.getAttribute("href");
      const count = results.get(href) ?? 0;
      total += count;
    }

    const label = parent.textContent.replace(/\s*\(\d+\)$/, "");
    parent.textContent = `${label} (${total})`;
  }

  console.log("✅ 카테고리 자동 카운트 완료");
}

document.addEventListener("DOMContentLoaded", autoCountMenu);
</script>

<script>
/* ============================================================
   🌐 FLUIGEL SPA ENGINE v3 — GitHub Pages 안정판
   - 핵심: 내부 HTML 이동을 /#/경로.html 해시 라우팅으로 처리
   - 새로고침해도 index.html 껍데기/메뉴 유지
   - target="_blank" / 파일 / 외부 링크 / 해시 링크 예외 유지
   ============================================================ */

/* 0) 기본 페이지 --------------------------------------------- */
const DEFAULT_PAGE = "main.html";

/* 1) 현재 URL에서 로딩할 페이지 경로 얻기 ---------------------- */
function getRoutePath() {
  // /#/PalJeongdo/test.html 또는 #/PalJeongdo/test.html 지원
  let hash = window.location.hash || "";

  if (hash.startsWith("#/")) {
    return hash.substring(2).replace(/^\/+/, "") || DEFAULT_PAGE;
  }

  if (hash.startsWith("#") && hash.length > 1) {
    return hash.substring(1).replace(/^\/+/, "") || DEFAULT_PAGE;
  }

  return DEFAULT_PAGE;
}

/* 2) 라우트 주소 만들기 --------------------------------------- */
function makeRoute(path) {
  const clean = path.replace(/^\/+/, "");
  return "/#/" + clean;
}

/* 3) HTML 페이지 로딩 ----------------------------------------- */
async function loadPage(path, push = true) {
  try {
    path = (path || DEFAULT_PAGE).replace(/^\/+/, "");

    const res = await fetch(window.location.origin + "/" + path);
    if (!res.ok) throw new Error("404");

    const html = await res.text();
    const main = document.getElementById("main-content");
    main.innerHTML = html;

    // 현재 폴더 경로 계산
    const folder = path.substring(0, path.lastIndexOf("/") + 1);
    fixLinks(folder);

    // 본문 바뀌면 화면 맨 위로
    window.scrollTo({ top: 0, behavior: "instant" });
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

    if (push) {
      history.pushState({ path }, "", makeRoute(path));
    } else {
      history.replaceState({ path }, "", makeRoute(path));
    }

    // 모바일 메뉴 열려 있으면 자동 닫기
    const menuPanel = document.getElementById("menu-panel");
    if (menuPanel) menuPanel.classList.remove("open");
    document.body.classList.remove("menu-open");

  } catch (err) {
    document.getElementById("main-content").innerHTML =
      "<h2>⚠ 페이지를 찾을 수 없습니다.</h2>";
  }
}

/* 4) 절대경로 판정 -------------------------------------------- */
function toAbsolute(href) {
  if (/^(https?:|mailto:|tel:)/.test(href)) return null;
  if (href.startsWith("#")) return null;
  if (href.startsWith("/")) return href;
  return "/" + href;
}

/* 5) SPA 라우팅 인터셉트 -------------------------------------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;

  const href = a.getAttribute("href");
  if (!href) return;

  // 새창 링크는 브라우저 기본동작
  if (a.target === "_blank") return;

  // 파일 링크는 SPA 제외
  if (/\.(txt|pdf|zip|png|jpg|jpeg|gif|svg|webp|mp3|mp4)$/i.test(href)) return;

  // 외부 링크 제외
  if (/^(https?:)?\/\//.test(href)) return;

  // 순수 해시 링크 제외
  if (href.startsWith("#") && !href.startsWith("#/")) return;

  const abs = toAbsolute(href);
  if (!abs) return;

  // .html 페이지만 SPA 처리
  if (!abs.endsWith(".html")) return;

  e.preventDefault();
  const clean = abs.replace(/^\//, "");
  loadPage(clean, true);
});

/* 6) 뒤로가기/앞으로가기 -------------------------------------- */
window.addEventListener("popstate", () => {
  loadPage(getRoutePath(), false);
});

/* 7) 첫 로딩 --------------------------------------------------- */
document.addEventListener("DOMContentLoaded", () => {
  loadPage(getRoutePath(), false);
});

/* 8) 본문 내부 상대 링크 자동 고침 ----------------------------- */
function fixLinks(basePath) {
  const links = document.querySelectorAll("#main-content a[href]");

  links.forEach(a => {
    let href = a.getAttribute("href");
    if (!href) return;

    // 파일, 외부, #, 새탭은 건드리지 않기
    if (a.target === "_blank") return;
    if (/\.(txt|pdf|zip|png|jpg|jpeg|gif|svg|webp|mp3|mp4)$/i.test(href)) return;
    if (/^(https?:)?\/\//.test(href)) return;
    if (href.startsWith("#")) return;

    // 본문 내부 상대경로를 사이트 루트 기준 절대경로로 보정
    if (!href.startsWith("/")) {
      a.setAttribute("href", "/" + basePath + href);
    }
  });
}
</script>
