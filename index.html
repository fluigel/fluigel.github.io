<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플뤼겔의 탑</title>

  <!-- 모든 경로를 절대경로(/) 기준으로 -->
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- 상단 배너 -->
  <header class="banner">
    <img src="/_Images/Banner2.png" alt="Banner">
  </header>

  <!-- 본문 + 오른쪽 메뉴 -->
  <section class="content">
    <main id="main-content">
      <div class="loading">Loading...</div>
    </main>
    <aside id="menu-panel"></aside>
  </section>

  <script>
    // -----------------------------
    // [1] 메뉴 불러오기
    // -----------------------------
    fetch('/menu.html')
      .then(r => r.text())
      .then(html => document.getElementById('menu-panel').innerHTML = html)
      .catch(() => document.getElementById('menu-panel').innerHTML =
        '<p style="color:red;">메뉴를 불러오지 못했습니다.</p>')

    // -----------------------------
    // [2] 초기 로드 (404 리디렉트 복구 포함)
    // -----------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const redirect = sessionStorage.redirect
      sessionStorage.removeItem('redirect')
      
      if (redirect) {
        const path = redirect.replace(/^\//, '')
        loadPage(path)
        history.replaceState(null, '', '/')
      } else {
        loadPage('main.html')
      }
    })

    // -----------------------------
    // [3] 메뉴 클릭 시 본문 교체
    // -----------------------------
    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-page]')
      if (!a) return
      e.preventDefault()

      const page = a.getAttribute('data-page')
      loadPage(page)
      history.pushState({ page }, '', '/' + page)
    })

    // -----------------------------
    // [4] 브라우저 뒤로가기/앞으로가기
    // -----------------------------
    window.addEventListener('popstate', e => {
      if (e.state && e.state.page) loadPage(e.state.page)
      else loadPage('main.html')
    })

    // -----------------------------
    // [5] 페이지 로더
    // -----------------------------
    async function loadPage(page) {
      const main = document.getElementById('main-content')
      main.innerHTML = '<div class="loading">Loading...</div>'
      try {
        const r = await fetch('/' + page)
        if (!r.ok) throw new Error()
        const t = await r.text()
        const doc = new DOMParser().parseFromString(t, 'text/html')
        main.innerHTML = doc.body ? doc.body.innerHTML : doc.innerHTML
      } catch {
        main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`
      }
    }
  </script>
</body>
</html>
