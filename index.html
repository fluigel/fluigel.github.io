  const toggleBtn = document.getElementById('menu-toggle');

      menuPanel.classList.remove('open');
      document.body.classList.remove('menu-open');
    }
  });

  <script>
    /* ############################################################
      🌐 FLUEGEL SPA ENGINE — GitHub Pages 최적화 버전
      ############################################################ */


    /* ============================================================
      1) 페이지 로딩 함수
      ============================================================ */
    async function loadPage(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("404");
        const html = await res.text();

        // 메인 컨테이너에 삽입
        document.getElementById("main-content").innerHTML = html;

        // pushState — 절대경로만 기록
        history.pushState({ path }, "", "/" + path);

      } catch (err) {
        // 404 fallback → 홈으로 돌림
        document.getElementById("main-content").innerHTML =
          "<h2>⚠ 페이지를 찾을 수 없습니다.</h2>";
      }
    }

    /* ============================================================
      2) 절대경로 강제 변환기
      ============================================================ */
    function toAbsolute(href) {
      // 외부 링크는 그대로
      if (/^(https?:|mailto:|tel)/.test(href)) return null;

      // #hash 링크도 SPA가 건드리지 않음
      if (href.startsWith("#")) return null;

      // 이미 절대경로라면 그대로
      if (href.startsWith("/")) return href;

      // 상대경로라면 절대경로로 변환
      return "/" + href;
    }

    /* ============================================================
      3) a 태그 클릭 인터셉트 (SPA 핵심)
      ============================================================ */
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (!a) return;

      const raw = a.getAttribute("href");
      if (!raw) return;

      const abs = toAbsolute(raw);
      if (!abs) return; // 외부 또는 hash

      e.preventDefault();

      // "/폴더/파일.html" → "폴더/파일.html"
      const clean = abs.replace(/^\//, "");

      loadPage(clean);
    });

    /* ============================================================
      4) 뒤로가기 / 앞으로가기 지원
      ============================================================ */
    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.path) {
        loadPage(e.state.path);
      }
    });

    /* ============================================================
      5) 첫 로딩 시 메인 페이지 불러오기
      ============================================================ */
    document.addEventListener("DOMContentLoaded", () => {
      loadPage("main.html");
    });
  </script>
