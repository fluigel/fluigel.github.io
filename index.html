    (function fixDoubleFolders() {
      const parts = location.pathname.split("/").filter(Boolean);
      for (let i = 0; i < parts.length - 1; i++) {
        if (parts[i] === parts[i + 1]) {
          parts.splice(i, 1);
          const fixed = "/" + parts.join("/") + location.search + location.hash;
          history.replaceState(null, "", fixed);
          break;
        }
      }
    })();

  <script>
    let currentRequest = null;

    async function loadPage(page) {
      const main = document.getElementById("main-content");
      if (!main) return;
      main.innerHTML = '<div class="loading">Loading...</div>';

      if (currentRequest) currentRequest.abort?.();
      const controller = new AbortController();
      currentRequest = controller;

      try {
        const fragmentURL = new URL("/" + page, location.origin);
        const url = new URL(fragmentURL);
        url.searchParams.set("_v", Date.now());
        const r = await fetch(url.toString(), { signal: controller.signal, cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const t = await r.text();
        const doc = new DOMParser().parseFromString(t, "text/html");
        let html = doc.body ? doc.body.innerHTML : doc.documentElement.innerHTML;
        const baseForFragment = fragmentURL.toString().replace(/[^/]*$/, "");
        html = html.replace(/(src|href)="(?!https?:|mailto:|tel:|#)([^"]+)"/g, (_, attr, path) => {
          try {
            const abs = new URL(path, baseForFragment).toString();
            return `${attr}="${abs}"`;
          } catch {
            return `${attr}="${path}"`;
          }
        });
        main.innerHTML = html;
        main.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href") || "";
          if (/^(https?:|mailto:|tel:|#)/i.test(href)) return;
          const abs = new URL(href, baseForFragment);
          if (abs.origin === location.origin) {
            const pagePath = abs.pathname.replace(/^\/+/, "");
            a.setAttribute("data-page", pagePath);
            a.setAttribute("href", "#");
          }
        });
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error("불러오기 실패:", page, err);
          main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`;
        }
      } finally {
        currentRequest = null;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const redirect = sessionStorage.redirect;
      if (redirect) {
        sessionStorage.removeItem("redirect");
        loadPage(redirect.replace(/^\//, ""));
        return;
      }
      const path = location.pathname.replace(/^\/+/, "");
      if (path && !path.endsWith("/")) {
        loadPage(path);
        history.replaceState({ page: path }, "", "/" + path);
      } else {
        loadPage("main.html");
      }
    });

    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-page]");
      if (!a) return;
      e.preventDefault();
      const page = a.getAttribute("data-page");
      loadPage(page);
      history.pushState({ page }, "", location.origin + "/" + page);
    });

    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.page) loadPage(e.state.page);
      else loadPage("main.html");
    });
  </script>

  <script>
  const toggleBtn = document.getElementById('menu-toggle');
  const menuPanel = document.getElementById('menu-panel');

  toggleBtn.addEventListener('click', () => {
    const open = menuPanel.classList.toggle('open');
    document.body.classList.toggle('menu-open', open);
  });

  document.addEventListener('click', (e) => {
    if (document.body.classList.contains('menu-open') &&
        !e.target.closest('#menu-panel') &&
        !e.target.closest('#menu-toggle')) {
      menuPanel.classList.remove('open');
      document.body.classList.remove('menu-open');
    }
  });
  </script>

  <!-- ✅ 모바일 vh 보정 -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    function setVhVariable(){
      const vh = (window.visualViewport?.height ?? window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVhVariable();
    window.addEventListener('resize', setVhVariable, {passive:true});
    window.addEventListener('orientationchange', setVhVariable, {passive:true});
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', setVhVariable, {passive:true});
    }
  });
  </script>
