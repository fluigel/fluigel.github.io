<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플뤼겔의 탑</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- 상단 배너 -->
  <header class="banner">
    <img src="_Images/Banner2.png" alt="Banner">
  </header>

  <!-- 본문 + 오른쪽 메뉴 -->
  <section class="content">
    <main id="main-content">
      <div class="loading">Loading...</div>
    </main>
    <aside id="menu-panel"></aside>
  </section>

  <!-- ==============================
       GitHub Pages SPA 전용 스크립트
       ============================== -->
  <script>
    // -----------------------------
    // [1] 메뉴 파일(menu.html) 불러오기
    // -----------------------------
    fetch('menu.html')
      .then(r => r.text())                                    // menu.html을 텍스트로 읽기
      .then(html => document.getElementById('menu-panel').innerHTML = html)  // 메뉴 영역에 삽입
      .catch(() => document.getElementById('menu-panel').innerHTML =
        '<p style="color:red;">메뉴를 불러오지 못했습니다.</p>')            // 실패 시 표시문

    // -----------------------------
    // [2] 초기 페이지 로드 (메인 or 404 복귀)
    // -----------------------------
    window.addEventListener('DOMContentLoaded', () => {
      // 404.html에서 돌아올 때 sessionStorage에 남겨둔 경로 확인
      const redirect = sessionStorage.redirect
      sessionStorage.removeItem('redirect')  // 사용 후 즉시 삭제 (중복 방지)
      
      if (redirect) {
        // 404.html에서 돌아온 경우 — 예: /Extra/.../_list.html 직접 접근
        const path = redirect.replace(/^\//, '')  // 맨 앞의 / 제거 → fetch 상대경로 맞추기
        loadPage(path)                            // 해당 페이지를 fetch로 불러옴
        history.replaceState(null, '', '/')       // 주소창을 루트("/")로 되돌림
      } else {
        // 일반 첫 방문 → 기본 페이지(main.html) 불러오기
        loadPage('main.html')
      }
    })

    // -----------------------------
    // [3] 메뉴 클릭 시 본문 교체
    // -----------------------------
    document.addEventListener('click', e => {
      const a = e.target.closest('a[data-page]')  // 클릭된 요소나 상위에서 data-page 가진 a태그 찾기
      if (!a) return                              // 없으면 무시
      e.preventDefault()                          // 기본 이동(새로고침) 막기
      
      const page = a.getAttribute('data-page')    // data-page 속성값 읽기 (상대경로)
      loadPage(page)                              // 해당 html 파일을 fetch로 불러오기
      history.pushState({ page }, '', page)       // 브라우저 기록에 경로 저장 (뒤/앞가기용)
    })

    // -----------------------------
    // [4] 브라우저 뒤로가기/앞으로가기 대응
    // -----------------------------
    window.addEventListener('popstate', e => {
      // history.pushState로 저장했던 상태 복원
      if (e.state && e.state.page) {
        loadPage(e.state.page)                    // 저장된 페이지 다시 로드
      } else {
        loadPage('main.html')                     // 없으면 기본(main.html)로 복귀
      }
    })

    // -----------------------------
    // [5] SPA 페이지 로더 함수
    // -----------------------------
    async function loadPage(page) {
      const main = document.getElementById('main-content')
      main.innerHTML = '<div class="loading">Loading...</div>'  // 로딩 중 표시
      
      try {
        const r = await fetch(page)               // 해당 html fetch
        if (!r.ok) throw new Error()              // 응답 실패 시 catch로 이동
        const t = await r.text()                  // html 텍스트로 읽기
        const doc = new DOMParser().parseFromString(t, 'text/html')  // 문자열 → HTML문서 파싱
        main.innerHTML = doc.body ? doc.body.innerHTML : doc.innerHTML // body 내부만 표시
      } catch {
        // 파일이 없거나 fetch 실패 시 붉은 오류 표시
        main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`
      }
    }
  </script>
</body>
</html>
