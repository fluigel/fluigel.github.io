  <script>
    (function fixDoubleFolders() {
      const parts = location.pathname.split("/").filter(Boolean);
      for (let i = 0; i < parts.length - 1; i++) {
        if (parts[i] === parts[i + 1]) {
          parts.splice(i, 1);
          const fixed = "/" + parts.join("/") + location.search + location.hash;
          history.replaceState(null, "", fixed);
          break;
        }
      }
    })();

  <!-- ⚙️ SPA 핵심 엔진 -->
  <script>
    let currentRequest = null;

    async function loadPage(page) {
      const main = document.getElementById("main-content");
      if (!main) return;
      main.innerHTML = '<div class="loading">Loading...</div>';

      if (currentRequest) currentRequest.abort?.();
      const controller = new AbortController();
      currentRequest = controller;

      try {
        // ✅ 절대경로로 고정 fetch
        const fragmentURL = new URL("/" + page, location.origin);
        const url = new URL(fragmentURL);
        url.searchParams.set("_v", Date.now());

        const r = await fetch(url.toString(), { signal: controller.signal, cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);

        const t = await r.text();
        const doc = new DOMParser().parseFromString(t, "text/html");
        let html = doc.body ? doc.body.innerHTML : doc.documentElement.innerHTML;

        // ✅ 조각 내부의 모든 상대경로를 절대경로로 승격
        const baseForFragment = fragmentURL.toString().replace(/[^/]*$/, "");
        html = html.replace(/(src|href)="(?!https?:|mailto:|tel:|#)([^"]+)"/g, (_, attr, path) => {
          try {
            const abs = new URL(path, baseForFragment).toString();
            return `${attr}="${abs}"`;
          } catch {
            return `${attr}="${path}"`;
          }
        });

        main.innerHTML = html;

        // ✅ 내부 링크를 다시 SPA용으로 재매핑
        main.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href") || "";
          if (/^(https?:|mailto:|tel:|#)/i.test(href)) return;
          const abs = new URL(href, baseForFragment);
          if (abs.origin === location.origin) {
            const pagePath = abs.pathname.replace(/^\/+/, "");
            a.setAttribute("data-page", pagePath);
            a.setAttribute("href", "#");
          }
        });
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error("불러오기 실패:", page, err);
          main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`;
        }
      } finally {
        currentRequest = null;
      }
    }

    /* ✅ 초기 로드 (직접 URL 진입 대응) */
    window.addEventListener("DOMContentLoaded", () => {
      const redirect = sessionStorage.redirect;
      if (redirect) {
        sessionStorage.removeItem("redirect");
        loadPage(redirect.replace(/^\//, ""));
        return;
      }

      const path = location.pathname.replace(/^\/+/, "");
      if (path && !path.endsWith("/")) {
        loadPage(path);
        history.replaceState({ page: path }, "", "/" + path);
      } else {
        loadPage("main.html");
      }
    });

    /* ✅ 메뉴 클릭 시 SPA 이동 */
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-page]");
      if (!a) return;
      e.preventDefault();
      const page = a.getAttribute("data-page");
      loadPage(page);
      history.pushState({ page }, "", location.origin + "/" + page);
    });

    /* ✅ 브라우저 뒤로/앞으로가기 */
    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.page) loadPage(e.state.page);
      else loadPage("main.html");
    });
  </script>
