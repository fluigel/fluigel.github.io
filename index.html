    // ✅ 중복폴더 자동 교정 (예: /Shindan/Shindan/x.html → /Shindan/x.html)
    (function fixDuplicatedPath() {
      const seg = location.pathname.split("/").filter(Boolean);
      for (let i = 0; i < seg.length - 1; i++) {
        if (seg[i] === seg[i + 1]) {
          seg.splice(i, 1);
          const fixed = "/" + seg.join("/") + location.search + location.hash;
          history.replaceState(null, "", fixed);
          break;
        }
      }
    })();

  <script>
    /* =====================================================
       SPA 로딩 엔진 (GitHub Pages 절대경로 기준)
       ===================================================== */
    let currentRequest = null;

    async function loadPage(page) {
      const main = document.getElementById("main-content");
      main.innerHTML = '<div class="loading">Loading...</div>';

      if (currentRequest) currentRequest.abort?.();
      const controller = new AbortController();
      currentRequest = controller;

      try {
        // ✅ 깃허브 기준 절대경로 fetch (루트 기준)
        const cacheBuster = "?_v=" + Date.now();
        const url = "/" + page + cacheBuster;
        console.log("📡 Fetch:", url);

        const r = await fetch(url, { signal: controller.signal, cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);

        const t = await r.text();
        const doc = new DOMParser().parseFromString(t, "text/html");
        let html = doc.body ? doc.body.innerHTML : doc.documentElement.innerHTML;

        // ✅ 상대경로 중복 방지 + 자동 보정
        const baseDir = page.includes("/") ? page.split("/")[0] + "/" : "";
        html = html.replace(/(src|href)="(?!https?:|mailto:|tel:|#)([^"]+)"/g, (m, attr, path) => {
          if (!path) return m;
          if (path.startsWith("/") || path.startsWith("_")) return `${attr}="${path}"`;
          if (path.startsWith(baseDir) || path.includes(baseDir)) return `${attr}="${path}"`;
          const corrected = `${baseDir}${path}`.replace(/\/{2,}/g, "/");
          return `${attr}="${corrected}"`;
        });

        main.innerHTML = html;
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error("불러오기 실패:", page, err);
          main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`;
        }
      } finally {
        currentRequest = null;
      }
    }

    // ✅ 초기 로드 (직접 URL 접근 대응)
    window.addEventListener("DOMContentLoaded", () => {
      const redirect = sessionStorage.redirect;
      if (redirect) {
        sessionStorage.removeItem("redirect");
        loadPage(redirect.replace(/^\//, ""));
        return;
      }
      const path = location.pathname.replace(/^\/+/, "");
      if (path && !path.endsWith("/")) {
        loadPage(path);
        history.replaceState({ page: path }, "", "/" + path);
      } else {
        loadPage("main.html");
      }
    });

    // ✅ 메뉴 클릭 이벤트
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-page]");
      if (!a) return;
      e.preventDefault();
      const page = a.getAttribute("data-page");
      loadPage(page);
      history.pushState({ page }, "", "/" + page);
    });

    // ✅ 뒤로가기 / 앞으로가기
    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.page) loadPage(e.state.page);
      else loadPage("main.html");
    });
  </script>
