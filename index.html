  <script>
    // -----------------------------
    // [1] 초기 로드
    // -----------------------------
    window.addEventListener("DOMContentLoaded", () => {
      const redirect = sessionStorage.redirect
      sessionStorage.removeItem("redirect")
      if (redirect) {
        const path = redirect.replace(/^\//, "")
        loadPage(path)
        history.replaceState(null, "", "./")
      } else {
        loadPage("main.html")
      }
    })

    // -----------------------------
    // [2] 메뉴 클릭 → 본문 교체
    // -----------------------------
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-page]")
      if (!a) return
      e.preventDefault()
      const page = a.getAttribute("data-page")
      loadPage(page)
      history.pushState({ page }, "", "./" + page)
    })

    // -----------------------------
    // [3] 뒤로가기/앞으로가기 대응
    // -----------------------------
    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.page) loadPage(e.state.page)
      else loadPage("main.html")
    })

    // -----------------------------
    // [4] 본문 교체 + 자동경로보정 + 안정화
    // -----------------------------
    let currentRequest = null // 중복요청 방지용

    async function loadPage(page) {
      const main = document.getElementById("main-content")
      main.innerHTML = '<div class="loading">Loading...</div>'

      // 🔒 이전 요청 중단
      if (currentRequest) currentRequest.abort?.()
      const controller = new AbortController()
      currentRequest = controller

      try {
        // 캐시 꼬임 방지용
        const cacheBuster = `?_v=${Date.now()}`
        const r = await fetch(`./${page}${cacheBuster}`, {
          signal: controller.signal,
          cache: "no-store",
        })

        if (!r.ok) throw new Error(`HTTP ${r.status}`)
        const t = await r.text()
        const doc = new DOMParser().parseFromString(t, "text/html")
        let html = doc.body ? doc.body.innerHTML : doc.innerHTML

        // -------------------------------------------------
        // 🧠 이미지·링크 자동보정 (상대경로 중복 방지 포함)
        // -------------------------------------------------
        const baseDir = page.substring(0, page.lastIndexOf("/") + 1)
        html = html.replace(/(src|href)="(?!https?:)([^"]+)"/g, (m, attr, path) => {
          // 외부링크나 절대경로(_ 또는 / 시작)는 그대로 둠
          if (path.startsWith("/") || path.startsWith("_")) return `${attr}="${path}"`

          // 이미 baseDir이 포함되어 있다면 중복 방지
          if (path.startsWith(baseDir)) return `${attr}="${path}"`

          // 상대경로 조합
          const corrected = `${baseDir}${path}`.replace(/\/{2,}/g, "/")
          return `${attr}="${corrected}"`
        })

        main.innerHTML = html
      } catch (err) {
        if (err.name === "AbortError") return
        console.error("불러오기 실패:", page, err)
        main.innerHTML = `<p style="color:red;">불러오기 실패: ${page}</p>`
      } finally {
        currentRequest = null
      }
    }
  </script>
