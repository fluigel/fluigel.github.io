<h1 id="_1">쿠치키 다케도</h1>
<p>쿠치키 다케도(朽木丈人) &lt;부처님 손바닥에서 30년 / 번역 [김해석]&gt;의 저자이며, 다소 어려워 보일 수 있는 정법(正法)의 내용을 특유의 솔직하고 꼼꼼하고 소탈한 필체를 통해 우리에게 많은 교훈을 주고 있다.</p>
<p>'부처님의실천!팔정도!'에 1화 링크이다.</p>

<p>주의의 평을 들어보면 많은 도움에 된다는 평이 많다는 것을 미뤄 볼 때 놓쳐서는 안될 것 같다.</p>
