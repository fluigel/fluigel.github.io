<h1 id="_1">기경팔맥 요약</h1>
<p>아래는 기경팔맥의 요약이다.</p>
<p>양교맥(陽蹻脈)</p>
<p>신맥(바깥 쪽 복숭아뼈 바로 아래) ~ 풍지(뒤통수와 목의 경계부분 목뼈의 좌우)</p>
<p>음교맥(陰蹻脈)</p>
<p>조해(안 쪽 복숭아뼈 바로 아래) ~ 정명(눈물샘 옆)</p>
<p>양유맥(陽維脈)</p>
<p>금문(발의 바깥 발바닥의 경계) ~ 아문(뒤통수와 목의 경계부분의 목뼈)</p>
<p>음유맥(陰維脈)</p>
<p>축빈(정강이 안쪽 중간) ~ 염천(목과 턱의 경계)</p>
<p>충맥(衝脈)</p>
<p>기충(사타쿠니) ~ 유문(명치 밑 갈비뼈 아래)</p>
