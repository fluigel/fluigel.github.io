<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>

  <script>
    /* ============================================================
       404 REDIRECT — GitHub Pages + Fluegel SPA 안전 리다이렉트
       ============================================================ */

    // 현재 경로 기억 (디버깅용 / 필요하면 메뉴 복구에도 사용 가능)
    sessionStorage.setItem("last-404-path", location.pathname);

    // 무한 루프 방지 — index가 이미 열렸다면 리다이렉트 금지
    const isIndex =
      location.pathname === "/" ||
      location.pathname === "/index.html";

    // 첫 접근인 경우에만 SPA가 개입
    const first404 = !sessionStorage.getItem("404-visited");

    if (!isIndex && first404) {
      sessionStorage.setItem("404-visited", "yes");
      // 루트 index로 강제 이동
      location.replace("/");
    }
  </script>

  <style>
    /* 깔끔한 로딩 화면 (잠깐 보일 수 있음) */
    body {
      font-family: sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .msg {
      opacity: 0.6;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="msg">Redirecting to Fluegel's Tower...</div>
</body>
</html>
