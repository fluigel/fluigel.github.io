<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 현재 경로 저장
    sessionStorage.redirect = location.pathname;

    // 🚨 무조건 index.html로 이동시키기
    // GitHub Pages는 디렉터리 경로도 허용하므로 "/"만 주면 index.html이 열림
    window.location.replace("/");
  </script>
</head>
<body></body>
</html>
