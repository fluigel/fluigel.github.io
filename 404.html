<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // SPA fallback for GitHub Pages
    (function() {
      const redirect = location.pathname + location.search + location.hash;
      sessionStorage.redirect = redirect;
      window.location.replace("/");
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
