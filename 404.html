<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>

  <script>
    // 현재 경로가 "/" 자체일 경우 404 반복 방지
    if (location.pathname === "/" || location.pathname === "/index.html") {
      // 그대로 홈으로 보여주기만 함
    } else {
      // 존재하지 않는 파일 → SPA 보호용 리셋
      window.location.replace("/");
    }
  </script>

  <style>
    body {
      font-family: sans-serif;
      background: #ffffff;
      color: #333;
      text-align: center;
      padding-top: 40vh;
    }
  </style>
</head>

<body>
  <h2>페이지를 찾을 수 없습니다.</h2>
  <p>잠시 후 홈으로 이동합니다…</p>
</body>
</html>
