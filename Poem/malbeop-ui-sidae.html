<h1 id="_1">말법(末法)의 시대</h1>
<p>추운 겨울이 걱정되어<br>
큰 버선을 하나 남겨 두었네</p>
<p>봄이 오고<br>
여름을 지나<br>
가을이 와서<br>
다시 겨울이 돌아왔건만</p>
<p>시린 발은 그냥 두고<br>
머리에 버선을 쓰고 있구나</p>
<p>이것이 말법(末法) 시대의 모습이로다</p>
<p>선문답이나<br>
주문이나</p>
<p>어깨너머 배운 것을<br>
침소봉대하여</p>
<p>임병투자개진열재전<br>
뜰 앞의 잣나무를<br>
진지하게 앉아<br>
되뇌는구나</p>
<p>그게,<br>
본래 무슨 뜻이었는지 아는가?</p>
