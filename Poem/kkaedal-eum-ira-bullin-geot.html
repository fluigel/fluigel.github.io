<div class="poem">
<h1 id="_1">깨달음이라 불린 것</h1>
<div class="poem-body">
<p>말이 멈춘 자리에<br>
먼저 말을 쏟아낸 이들이 있었다</p>
<p>먼저 돌아서<br>
자신의 발자취를 살펴야 하거늘</p>
<p>섣부른 결론은<br>
누군가의 지도가 되고<br>
나침반이 된다</p>
<p>보이지 않는다 하여<br>
없는 것이 아니고</p>
<p>고요하다 하여<br>
사라지는 것도 아니다</p>
<p>진정한 침묵이란<br>
말로 다 담을 수 없음이지</p>
<p>권위로<br>
타인을 누르려는 것이 아니다</p>
<p>깨달음은<br>
두고 온 고향을 그리는 노래</p>
<p>침묵은<br>
목소리로 다 담을 수 없는 그리움</p>
<p>그러니 우리는 걷는다<br>
말을 버리지 않고<br>
침묵을 흉내내지도 않으며</p>
<p>스스로 껍질을 벗은<br>
그 발걸음으로</p>
</div>
</div>
